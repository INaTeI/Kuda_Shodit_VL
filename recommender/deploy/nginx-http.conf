# Only inference POSTs consume the Qwen quotas; Swagger GETs do not.
map "$request_method:$qwen_original_uri" $qwen_rate_key {
    default "";
    ~^POST:/model/(recommendations|places/[^/]+/similar)$ $binary_remote_addr;
}
map "$request_method:$qwen_original_uri" $qwen_connection_key {
    default "";
    ~^POST:/model/(recommendations|places/[^/]+/similar)$ $server_name;
}
limit_req_zone $qwen_rate_key zone=qwen_requests:1m rate=10r/m;
limit_conn_zone $qwen_connection_key zone=qwen_inference:1m;

location = /model { absolute_redirect off; return 302 /model/docs; }
location = /model/ { absolute_redirect off; return 302 /model/docs; }
location ^~ /model/ {
    client_max_body_size 16k;
    limit_req zone=qwen_requests burst=3 nodelay;
    limit_req_status 429;
    limit_conn qwen_inference 2;
    limit_conn_status 429;
    error_page 429 = @qwen_busy;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qwen_backend qwen-recommender:8000;
    set $qwen_original_uri $uri;
    rewrite ^/model/(.*)$ /$1 break;
    proxy_pass http://$qwen_backend$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 15s;
}
location @qwen_busy {
    default_type application/json;
    add_header Retry-After 6 always;
    return 429 '{"detail":"Qwen is busy. Retry in a few seconds."}';
}

name: vdk-recommender
services:
  qwen:
    image: vdk-qwen:7296c17
    build: .
    user: "10001:10001"
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--root-path", "/model"]
    environment:
      DEVICE: cpu
      QUERY_ADAPTER_MODE: base
      HF_HOME: /tmp/huggingface
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - /opt/vdk-recommender/shared/models:/app/models:ro
      - /opt/vdk-recommender/shared/cache:/app/cache
    networks:
      default: {}
      edge:
        aliases: [qwen-recommender]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    memswap_limit: 4g
    cpus: 1.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 5

networks:
  edge:
    external: true
    name: vdk-gid_edge_v2

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Конструктор места — VDK GID</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,500&display=swap"
/>
<style>
/* ───────── Токены сервиса (не настраиваются владельцем) ───────── */
:root {
  --bg: #f6f7f5;
  --accent: #157f8c;
  --accent-strong: #106775;
  --accent-soft: #d3ecee;
  --ink: #16343b;
  --muted: #5d6f73;
  --line: #dfe7e5;
  --paper: #fff;
  --danger: #a3432f;
  --warn: #8a5a00;
  --radius: 20px;
  --radius-sm: 12px;
  --serif: "Source Serif 4", "Source Serif Pro", Georgia, serif;
  --sans: Inter, "Segoe UI", Arial, sans-serif;
  --shadow: 0 10px 24px #16343b14;
  --panel-w: 372px;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--bg);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
em, .serif { font-family: var(--serif); font-style: italic; font-weight: 400; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn {
  min-height: 40px; padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid #c6d5d3; background: transparent; cursor: pointer;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s, border-color .15s, color .15s;
}
.btn:hover { background: #e5eeeb; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { border-color: transparent; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 10px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 40px; padding: 0; }

/* ───────── Верхняя панель ───────── */
.topbar {
  position: sticky; top: 0; z-index: 30; background: #f6f7f5f2; backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 20px; flex-wrap: nowrap; min-height: var(--top-h, 62px);
}
.brand { font-weight: 700; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; }
.brand em { color: var(--accent); font-size: 21px; }
.tabs, .seg { display: inline-flex; padding: 3px; background: #e8eeec; border-radius: 12px; gap: 2px; }
.tabs button, .seg button {
  border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; min-height: 34px;
  font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer;
}
.tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px #16343b1f; }
.tabs button:hover, .seg button:hover { color: var(--ink); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.topbar .spacer { flex: 1; }
.status { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.publish-short { display: none; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: #9fb3b1; }
.status[data-state="dirty"] .dot { background: #d29a2b; }
.status[data-state="review"] .dot { background: var(--accent); }
.role { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.role select { border: 1px solid #c6d5d3; border-radius: 10px; padding: 6px 8px; background: var(--paper); }

/* ───────── Рабочая область ───────── */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); min-height: calc(100vh - var(--top-h, 62px)); }
.workspace.view { grid-template-columns: minmax(0, 1fr); }
.stage { padding: 24px 28px 120px; overflow: auto; }
.stage-tools { display: flex; align-items: center; gap: 12px; justify-content: space-between; margin: 0 auto 16px; max-width: 1040px; flex-wrap: wrap; }
.stage-tools p { margin: 0; font-size: 13px; color: var(--muted); }
.frame { margin: auto; max-width: 1040px; transition: max-width .25s ease; }
.frame.mobile { max-width: 400px; }
.frame.mobile .device { border: 10px solid #16343b; border-radius: 36px; overflow: hidden; }

/* ───────── Страница места (холст) ───────── */
.device { background: var(--bg); border-radius: 24px; }
.site-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--line); gap: 12px; }
.site-head nav { display: flex; gap: 18px; font-size: 14px; color: var(--muted); }
.frame.mobile .site-head nav { display: none; }
.page { padding: 20px 24px 28px; }
.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.frame.mobile .page { padding: 16px; }
.frame.mobile .grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
.blk { position: relative; grid-column: span 1; border-radius: 24px; }
.blk.full, .frame.mobile .blk { grid-column: 1 / -1; }
.blk-inner {
  background: var(--b-bg); color: var(--b-text); border-radius: var(--radius); padding: 22px 24px;
  border: 1px solid var(--b-border, transparent); overflow-wrap: anywhere; height: 100%;
}
.blk-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; opacity: .85; margin: 0 0 8px; }
.blk[data-type="title"] .blk-inner { padding: 18px 24px; }
.blk[data-type="title"] .cat { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 10px; }
.blk[data-type="title"] h1 { margin: 0; font-weight: 600; letter-spacing: -.045em; line-height: 1.05; }
.blk[data-type="title"] h1 em { color: var(--b-accent); }
.blk[data-type="title"][data-size="S"] h1 { font-size: 30px; }
.blk[data-type="title"][data-size="M"] h1 { font-size: clamp(32px, 4.4vw, 46px); }
.blk[data-type="title"][data-size="L"] h1 { font-size: clamp(36px, 6vw, 64px); }
.blk[data-type="description"] p { margin: 0 0 .8em; line-height: 1.7; white-space: pre-line; }
.blk[data-type="description"] p:last-child { margin-bottom: 0; }
.blk[data-type="description"][data-size="S"] { font-size: 15px; }
.blk[data-type="description"][data-size="M"] { font-size: 17px; }
.blk[data-type="description"][data-size="L"] { font-size: 20px; }
.blk[data-type="address"] .addr { font-weight: 500; line-height: 1.4; margin: 0 0 12px; }
.blk[data-type="address"][data-size="S"] .addr { font-size: 15px; }
.blk[data-type="address"][data-size="M"] .addr { font-size: 18px; }
.blk[data-type="address"][data-size="L"] .addr { font-size: 23px; }
.blk .inline-link { background: none; border: 0; padding: 0; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; min-height: 24px; }
.blk[data-type="price"] .amount { font-weight: 650; letter-spacing: -.03em; line-height: 1.1; }
.blk[data-type="price"][data-size="S"] .amount { font-size: 22px; }
.blk[data-type="price"][data-size="M"] .amount { font-size: 30px; }
.blk[data-type="price"][data-size="L"] .amount { font-size: 42px; }
.blk[data-type="price"] .note { font-size: 14px; margin: 6px 0 0; line-height: 1.5; }
.blk[data-type="gallery"] .blk-inner { padding: 10px; }
.gal-main { position: relative; border-radius: 14px; overflow: hidden; background: #dfe7e5; }
.gal-main img { display: block; width: 100%; object-fit: cover; }
.blk[data-type="gallery"][data-size="S"] .gal-main img { height: 220px; }
.blk[data-type="gallery"][data-size="M"] .gal-main img { height: 340px; }
.blk[data-type="gallery"][data-size="L"] .gal-main img { height: 460px; }
.frame.mobile .blk[data-type="gallery"] .gal-main img { height: 260px; }
.gal-thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding: 2px; }
.gal-thumbs button { flex: 0 0 auto; width: 72px; height: 54px; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; background: #dfe7e5; }
.gal-thumbs button[aria-current="true"] { border-color: var(--b-accent, var(--accent)); }
.gal-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gal-empty { display: grid; place-items: center; text-align: center; gap: 8px; padding: 40px 20px; min-height: 220px; border: 2px dashed #b9cccb; border-radius: 14px; color: var(--muted); }
.main-badge {
  position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 6px;
  background: #fffffff2; color: var(--ink); font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; box-shadow: var(--shadow);
}
.main-badge .star { color: #c98a00; }

/* Системный блок действий: одинаков у всех мест */
.actions-bar { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sys-note { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.react-pill { display: inline-flex; align-items: center; gap: 22px; padding: 8px 24px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 16px 32px #16343b21; }
.react-pill button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
.react-pill svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.react-pill .r-no { color: #b4513d; } .react-pill .r-yes { color: var(--accent); } .react-pill .r-skip { color: var(--muted); width: 46px; height: 46px; }
.react-pill .heart { fill: transparent; transition: fill .2s; }
.react-pill button:hover .heart, .react-pill button[aria-pressed="true"] .heart { fill: currentColor; }
.react-pill .r-no[aria-pressed="true"] .slash, .react-pill .r-no:hover .slash { stroke: #fff; }
.react-pill .eye { fill: currentColor; stroke: none; }
.react-pill button[aria-pressed="true"], .react-pill button:hover { background: #eef4f3; }

/* ───────── Режим редактирования: обвязка блоков ───────── */
.editing .blk { cursor: pointer; outline: 2px dashed transparent; outline-offset: 5px; transition: outline-color .12s; }
.editing .blk:hover { outline-color: #9cc9cf; }
.editing .blk.selected { outline: 2px solid var(--accent); }
.editing .blk:focus-visible { outline: 3px solid var(--accent); }
.blk-tag {
  position: absolute; z-index: 5; top: -15px; left: 14px; display: inline-flex; align-items: center; gap: 2px;
  background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 4px 2px 2px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .12s;
}
.editing .blk:hover .blk-tag, .editing .blk.selected .blk-tag, .editing .blk:focus-within .blk-tag { opacity: 1; pointer-events: auto; }
.blk-tag button { border: 0; background: transparent; color: #fff; border-radius: 999px; min-width: 28px; height: 28px; display: grid; place-items: center; cursor: pointer; padding: 0 6px; font-size: 13px; }
.blk-tag button:hover { background: #ffffff26; }
.blk-tag .handle { cursor: grab; letter-spacing: -2px; }
.blk-tag .name { padding: 0 6px; }
.editing .blk.is-hidden .blk-inner { opacity: .35; filter: grayscale(.6); }
.editing .blk.is-hidden::after {
  content: "Скрыт — посетители его не видят"; position: absolute; inset: 12px 12px auto auto; background: var(--ink); color: #fff;
  font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
}
.editing .blk a, .editing .blk .inline-link, .editing .gal-thumbs button { pointer-events: none; }
.blk.dragging { z-index: 20; opacity: .9; box-shadow: 0 24px 48px #16343b33; cursor: grabbing; pointer-events: none; }
.blk.drop-before::before, .blk.drop-after::before, .blk.drop-left::before, .blk.drop-right::before {
  content: ""; position: absolute; background: var(--accent); border-radius: 4px; z-index: 6;
}
.blk.drop-before::before { left: 0; right: 0; top: -10px; height: 4px; }
.blk.drop-after::before { left: 0; right: 0; bottom: -10px; height: 4px; }
.blk.drop-left::before { top: 0; bottom: 0; left: -10px; width: 4px; }
.blk.drop-right::before { top: 0; bottom: 0; right: -10px; width: 4px; }

/* ───────── Панель инструментов ───────── */
.panel { background: var(--paper); border-left: 1px solid var(--line); position: sticky; top: var(--top-h, 62px); height: calc(100vh - var(--top-h, 62px)); overflow: auto; }
.blk { scroll-margin-top: calc(var(--top-h, 62px) + 24px); }
.panel-head { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.panel-head h2 { font-size: 18px; margin: 0; letter-spacing: -.02em; flex: 1; }
.panel-head .kicker { display: block; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-bottom: 2px; }
.sheet-toggle { display: none; }
.sec { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
.hint.warn { color: var(--warn); }
.hint.err { color: var(--danger); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label, .field .lbl { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.field .count { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.field .count.over { color: var(--danger); }
.field input[type="text"], .field textarea, .field select {
  width: 100%; border: 1px solid #c6d5d3; border-radius: 10px; padding: 9px 11px; background: var(--paper); line-height: 1.5;
}
.field textarea { min-height: 150px; resize: vertical; }
.field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible { outline-offset: 0; }
.readonly { background: #f2f5f4; border: 1px dashed #c6d5d3; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.lock { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; font-weight: 500; }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { position: relative; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw input:disabled { cursor: not-allowed; }
.sw span {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c);
  border: 1px solid #16343b33; font-size: 12px; font-weight: 700; color: var(--t, var(--ink));
}
.sw input:checked + span { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent); }
.sw input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 4px; }
.sw input:disabled + span { opacity: .3; background-image: linear-gradient(135deg, transparent 46%, #a3432f 46% 54%, transparent 54%); }
.sw.text span { border-radius: 10px; width: auto; min-width: 42px; padding: 0 8px; background: var(--bgc); color: var(--c); font-size: 15px; }
.contrast { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; }
.contrast .chip { font-weight: 700; border-radius: 999px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.contrast .ok { background: #dff1e8; color: #135c41; }
.contrast .mid { background: #fdf0d5; color: #6b4600; }

.full-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg.wide { display: flex; width: 100%; }
.seg.wide button { flex: 1; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { position: relative; width: 46px; height: 28px; flex: 0 0 auto; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch input:disabled { cursor: not-allowed; }
.switch span { position: absolute; inset: 0; background: #c6d5d3; border-radius: 999px; transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px #0003; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 3px; }
.switch input:disabled + span { opacity: .5; }

/* Пресеты */
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 10px; }
.preset { border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 8px; cursor: pointer; text-align: left; display: grid; gap: 6px; }
.preset:hover { border-color: #9cc9cf; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.preset .mini-pv { height: 64px; border-radius: 9px; background: var(--bg); padding: 5px; display: grid; gap: 3px; grid-template-columns: 1fr 1fr; align-content: start; }
.preset .mini-pv i { display: block; border-radius: 4px; height: 10px; }
.preset .mini-pv i.f { grid-column: 1 / -1; }
.preset .mini-pv i.tall { height: 22px; }
.preset strong { font-size: 13px; }
.preset small { font-size: 11px; color: var(--muted); line-height: 1.3; }

/* Список блоков (слои) */
.layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.layers li { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 12px; }
.layers li.hidden-row .ln { color: var(--muted); text-decoration: line-through; }
.layers .ln { flex: 1; text-align: left; border: 0; background: none; padding: 8px 0; font-weight: 600; cursor: pointer; font-size: 14px; }
.layers .ln small { font-weight: 500; color: var(--muted); margin-left: 6px; }
.layers .mini { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; font-size: 15px; }
.layers .mini:hover { background: #eef4f3; }
.layers .mini:disabled { opacity: .3; cursor: not-allowed; background: transparent; }

/* Менеджер галереи */
.ph-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ph { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; border: 2px solid transparent; padding: 0; cursor: pointer; background: #dfe7e5; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph[aria-pressed="true"] { border-color: var(--accent); }
.ph .tag { position: absolute; left: 4px; top: 4px; background: #fffffff2; color: var(--ink); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 999px; }
.ph .tag .star { color: #c98a00; }
.ph .num { position: absolute; right: 4px; bottom: 4px; background: #16343bcc; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 999px; }
.drop { border: 2px dashed #b9cccb; border-radius: 12px; padding: 14px; text-align: center; font-size: 14px; color: var(--muted); display: grid; gap: 8px; place-items: center; margin-top: 10px; transition: background .15s, border-color .15s; }
.drop.over { background: var(--accent-soft); border-color: var(--accent); }
.ph-detail { margin-top: 12px; display: grid; gap: 10px; }
.ph-detail .row { display: flex; gap: 6px; flex-wrap: wrap; }
.is-main-note { display: flex; gap: 8px; align-items: center; background: #fff6df; border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; }

/* ───────── Мини-профиль (карточка) ───────── */
.card-stage { display: grid; place-items: center; gap: 22px; padding-top: 12px; }
.deck { position: relative; width: min(360px, 100%); }
.deck .ghost { position: absolute; inset: 14px 10px -10px; border-radius: 22px; background: #d6e5dd; transform: rotate(2.5deg); }
.deck .ghost.g2 { inset: 22px 18px -18px; background: #e4ece8; transform: rotate(-2deg); }
.mini {
  position: relative; border-radius: var(--radius); overflow: hidden; background: var(--c-bg); color: var(--c-text);
  border: 1px solid var(--c-border, var(--line)); box-shadow: var(--shadow); width: 100%;
}
.mini.framed { padding: 10px 10px 0; }
.mini.framed .mini-photo { border-radius: 12px; }
.mini-photo { position: relative; height: 300px; overflow: hidden; background: #dfe7e5; }
.mini-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-photo .noph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
.mini-stickers { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.sticker { background: #ffffffeb; color: var(--ink); font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; box-shadow: 0 2px 8px #16343b26; transform: rotate(var(--rot, -2deg)); white-space: nowrap; }
.sticker.editor { background: var(--accent); color: #fff; }

function swatchesBG(name, current) {

}
function swatchesText(cfg) {
  const bgH = hex(cfg.bg);
  return `<div class="swatches" role="radiogroup" aria-label="Цвет текста">${TEXT.map((x) => {
    const h = x.id === "auto" ? autoText(bgH) : x.hex, r = ratio(h, bgH), bad = x.id !== "auto" && r < 4.5;
    const title = x.id === "auto" ? `${x.name}` : bad ? `${x.name}: контраст ${r.toFixed(1)} : 1 — нечитаемо на этом фоне` : `${x.name}: контраст ${r.toFixed(1)} : 1`;
    return `<label class="sw text" title="${title}"><input type="radio" name="txt" value="${x.id}" ${x.id === cfg.text ? "checked" : ""} ${bad ? "disabled" : ""} data-fk="txt-${x.id}"><span style="--bgc:${bgH};--c:${h}">${x.id === "auto" ? "Авто" : "Аа"}</span><span class="sr">${title}</span></label>`;
  }).join("")}</div>`;
}
function contrastLine(cfg) {
  const { bgH, t } = blockColors(cfg), r = ratio(t, bgH);
  const lvl = r >= 7 ? ["ok", "отлично читается"] : ["mid", "читается (норма WCAG AA)"];
  return `<div class="contrast"><span class="chip ${lvl[0]}">${r.toFixed(1)} : 1</span><span>${lvl[1]}</span></div>
    <p class="hint">Перечёркнутые цвета текста недоступны: на выбранном фоне их было бы трудно прочитать.</p>`;
}

  const chosen = S.card.items.length ? S.card.items.map((id) => {
    const d = DECOR[id], lockd = d.mod && UI.role !== "moderator";
    return `<button data-remove="${id}" ${lockd ? "disabled" : ""} aria-label="Убрать «${d.l}», вес ${d.w}" title="${lockd ? "Добавлено модератором" : "Убрать"}" data-fk="ch-${id}">${d.g || d.l} <span class="w">${d.w}</span><span class="x" aria-hidden="true">${lockd ? "🔒" : "×"}</span></button>`;
  }).join("") : `<span class="chosen-empty">Пока ничего — выберите ниже.</span>`;
  const m = mainPhoto();
  return head("Карточка в ленте", "Мини-профиль") + `
    <div class="sec"><h3>Из профиля <span class="lock">🔒 только чтение</span></h3>
      <div style="display:flex;gap:12px;align-items:center">${m ? `<img src="${m.src}" alt="" style="width:64px;height:48px;object-fit:cover;border-radius:8px">` : ""}<div style="min-width:0"><strong style="display:block;overflow-wrap:anywhere">${esc(S.place.name)}</strong><small style="color:var(--muted)">${m ? "главное фото и название" : "главное фото не выбрано"}</small></div></div>
      <button class="btn small" style="margin-top:10px" data-act="gotogallery" data-fk="gotogal">Изменить на странице места →</button></div>
    <div class="sec"><h3>Стиль карточки</h3>
      <div class="presets">${Object.entries(CARD_PRESETS).map(([k, p]) => `<button class="preset" data-cardpreset="${k}" aria-pressed="${S.card.preset === k}" data-fk="cp-${k}"><span class="mini-pv" aria-hidden="true" style="grid-template-columns:1fr;background:${hex(p.bg)};${p.framed ? "padding:6px" : "padding:0;overflow:hidden"};box-shadow:inset 0 0 0 1px #dfe7e5"><i class="tall" style="height:36px;background:#7FBFC6;border-radius:${p.framed ? "4px" : "0"}"></i><i style="width:60%;height:6px;margin:4px 6px 0;background:${autoText(hex(p.bg))};opacity:.8"></i></span><strong>${p.name}</strong></button>`).join("")}</div>
      <div class="field" style="margin-top:14px"><span class="lbl">Цвет карточки <span class="count">текст подбирается автоматически</span></span>${swatchesBG("cardbg", S.card.bg)}</div></div>
    <div class="sec"><h3>Смайлики и стикеры</h3>
      <div class="meter-wrap" data-level="${lvl}">
        <div class="meter-top"><span class="meter-val" aria-hidden="true">${w} <small>/ ${MAX_WEIGHT}</small></span><span class="hint" style="margin:0">${lvl === "full" ? "лимит достигнут" : `свободно ${left}`}</span></div>
        <div class="meter" role="meter" aria-label="Вес украшений" aria-valuemin="0" aria-valuemax="${MAX_WEIGHT}" aria-valuenow="${w}" aria-valuetext="${w} из ${MAX_WEIGHT}"><i style="width:${(w / MAX_WEIGHT) * 100}%"></i></div>
        ${lvl === "full" ? `<div class="limit-banner"><span aria-hidden="true">⦸</span><span>Лимит 50 заполнен. Уберите смайлик или стикер, чтобы добавить другой.</span></div>` : ""}
      </div>
      <p class="hint">Вес не даёт перегрузить карточку: чем заметнее украшение, тем он больше. Каждое можно добавить один раз.</p>
      <div class="field" style="margin-top:14px"><span class="lbl">На карточке</span><div class="chosen">${chosen}</div></div>
      <p class="live ${UI.liveErr ? "err" : ""}" aria-live="polite" id="live">${esc(UI.live)}</p></div>
    <div class="sec"><h3>Смайлики <span class="count" style="font-weight:500;text-transform:none;letter-spacing:0">число — вес</span></h3><div class="decor-grid">${EMOJI.map(decorBtn).join("")}</div></div>
    <div class="sec"><h3>Стикеры</h3><div class="sticker-grid">${STICKERS.map(decorBtn).join("")}</div>
      <p class="hint">Стикеры — это настроение, а не факты. Цену, часы работы и «бесплатно» показывает только проверенная карточка каталога.</p></div>`;
}

/* ═════════════ Общий рендер ═════════════ */
const $ = (s, r = document) => r.querySelector(s);
function render({ inspector = true } = {}) {
  const fk = document.activeElement?.dataset?.fk;
  const edit = UI.mode === "edit";
  $("#workspace").classList.toggle("view", !edit);
  document.querySelectorAll("[data-tab]").forEach((t) => { t.setAttribute("aria-selected", t.dataset.tab === UI.tab); t.tabIndex = t.dataset.tab === UI.tab ? 0 : -1; });
  document.querySelectorAll("[data-mode]").forEach((t) => t.setAttribute("aria-pressed", t.dataset.mode === UI.mode));
  $("#stage").innerHTML = UI.tab === "page" ? renderPage() : renderCardStage();
  $("#stage").setAttribute("aria-label", UI.tab === "page" ? "Холст страницы места" : "Предпросмотр карточки");
  const panel = $("#panel");
  panel.hidden = !edit;
  panel.classList.toggle("collapsed", UI.sheet !== "open");
  if (edit && inspector) { panel.innerHTML = UI.tab === "page" ? panelPage() : panelCard(); bindDrop(); }
  $("#undo").disabled = !past.length; $("#redo").disabled = !future.length;
  const mod = UI.role === "moderator";
  const pl = mod ? ["Опубликовать", "Опубликовать"] : UI.reviewed ? ["На проверке", "На проверке"] : ["Отправить на проверку", "Отправить"];
  $("#publish .publish-long").textContent = pl[0]; $("#publish .publish-short").textContent = pl[1];
  $("#publish").disabled = !mod && UI.reviewed;
  const st = $("#status");
  st.dataset.state = UI.reviewed ? "review" : UI.dirty ? "dirty" : "clean";
  $("#status-text").textContent = UI.reviewed ? "Отправлено на проверку" : UI.savedAt ? `Черновик · сохранено ${UI.savedAt.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}` : "Черновик";
  if (fk) document.querySelector(`[data-fk="${CSS.escape(fk)}"]`)?.focus({ preventScroll: true });
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800); }

/* ═════════════ Действия ═════════════ */
function select(id) { UI.selected = id; UI.sheet = "open"; render(); $("#panel .panel-head h2")?.scrollIntoView?.({ block: "nearest" }); }
function moveBlock(id, dir) {
  const o = S.page.order, i = o.indexOf(id), j = i + dir;
  if (j < 0 || j >= o.length) return;
  commit(() => { [o[i], o[j]] = [o[j], o[i]]; });
}
function toggleHidden(id) {
  if (!BLOCKS[id].hideable) return toast(BLOCKS[id].why);
  commit(() => { S.page.blocks[id].hidden = !S.page.blocks[id].hidden; });
  toast(S.page.blocks[id].hidden ? `Блок «${BLOCKS[id].name}» скрыт` : `Блок «${BLOCKS[id].name}» снова виден`);
}
function setCard(fn) { commit(fn); }
function toggleDecor(id) {
  const d = DECOR[id], on = S.card.items.includes(id), left = MAX_WEIGHT - weight();
  if (d.mod && UI.role !== "moderator") { UI.live = "«Выбор редакции» ставит только модератор."; UI.liveErr = true; return render(); }
  if (on) { UI.live = `«${d.l}» убрано, освободилось ${d.w}.`; UI.liveErr = false; return setCard(() => { S.card.items = S.card.items.filter((x) => x !== id); }); }
  if (d.w > left) { UI.live = `«${d.l}» не помещается: нужно ${d.w}, свободно ${left}. Уберите что-нибудь с карточки.`; UI.liveErr = true; return render(); }
  UI.live = `«${d.l}» добавлено. ${weight() + d.w} из ${MAX_WEIGHT}.`; UI.liveErr = false;
  setCard(() => { S.card.items.push(id); });
}
function addFiles(files) {
  UI.uploadErr = "";
  const list = [...files], room = MAX_PHOTOS - S.place.photos.length;
  if (room <= 0) { UI.uploadErr = `Уже ${MAX_PHOTOS} фото — удалите лишнее, чтобы добавить новое.`; return render(); }
  const bad = list.filter((f) => !/^image\/(jpeg|png|webp)$/.test(f.type)), big = list.filter((f) => f.size > MAX_FILE_MB * 1048576);
  const ok = list.filter((f) => !bad.includes(f) && !big.includes(f)).slice(0, room);
  const errs = [];
  if (bad.length) errs.push(`не подходит формат: ${bad.map((f) => f.name).join(", ")}`);
  if (big.length) errs.push(`больше ${MAX_FILE_MB} МБ: ${big.map((f) => f.name).join(", ")}`);
  if (list.length - bad.length - big.length > room) errs.push(`поместилось только ${room}`);
  UI.uploadErr = errs.length ? "Не загружено — " + errs.join("; ") + "." : "";
  if (!ok.length) return render();
  Promise.all(ok.map(downscale)).then((srcs) => {
    commit(() => {
      srcs.forEach((src, i) => {
        const id = uid();
        S.place.photos.push({ id, src, alt: "" });
        if (!S.place.mainId) S.place.mainId = id;
        if (i === srcs.length - 1) UI.photoSel = id;
      });
    });
    toast(srcs.length === 1 ? "Фото добавлено. Добавьте описание для незрячих." : `Добавлено фото: ${srcs.length}`);
  }).catch(() => { UI.uploadErr = "Не удалось прочитать файл. Попробуйте другое фото."; render(); });
}
function downscale(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function bindDrop() {
  const z = $("#drop"); if (!z) return;
  z.addEventListener("dragover", (e) => { e.preventDefault(); z.classList.add("over"); });
  z.addEventListener("dragleave", () => z.classList.remove("over"));
  z.addEventListener("drop", (e) => { e.preventDefault(); z.classList.remove("over"); addFiles(e.dataTransfer.files); });
}

/* Перетаскивание блоков (мышь, перо, палец) */
function startDrag(e, id) {
  if (e.button !== 0) return;
  e.preventDefault();
  const el = document.querySelector(`.blk[data-id="${id}"]`), sx = e.clientX, sy = e.clientY;
  let target = null, pos = null, moved = false;
  const clear = () => document.querySelectorAll(".drop-before,.drop-after,.drop-left,.drop-right").forEach((n) => n.classList.remove("drop-before", "drop-after", "drop-left", "drop-right"));
  const move = (ev) => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 4) return;
    moved = true; el.classList.add("dragging");
    el.style.transform = `translate(${ev.clientX - sx}px, ${ev.clientY - sy}px)`;
    clear(); target = null;
    const under = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".blk");
    if (under && under !== el) {
      const r = under.getBoundingClientRect(), side = under.classList.contains("half") && UI.viewport !== "mobile" && innerWidth > 560;
      pos = side ? (ev.clientX > r.left + r.width / 2 ? "right" : "left") : (ev.clientY > r.top + r.height / 2 ? "after" : "before");
      under.classList.add("drop-" + pos); target = under.dataset.id;
    }
  };
  const up = () => {
    removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
    clear(); el.classList.remove("dragging"); el.style.transform = "";
    if (!moved) return select(id);
    if (!target) return;
    commit(() => {
      const o = S.page.order.filter((x) => x !== id), i = o.indexOf(target);
      o.splice(pos === "after" || pos === "right" ? i + 1 : i, 0, id); S.page.order = o;
    });
    UI.selected = id; render(); toast(`Блок «${BLOCKS[id].name}» перемещён`);
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
}

/* ═════════════ События ═════════════ */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-remove], .blk, label, input");
  if (!t) return;
  if (t.classList.contains("blk")) { if (UI.mode === "edit" && UI.tab === "page") select(t.dataset.id); return; }
  const d = t.dataset;
  if (t.matches("[aria-disabled='true']") && !d.decor) { if (d.act === "upload") { UI.uploadErr = `Уже ${MAX_PHOTOS} фото — удалите лишнее.`; render(); } return; }
  if (d.tab) { UI.tab = d.tab; UI.selected = null; UI.live = ""; return render(); }
  if (d.mode) { UI.mode = d.mode; UI.selected = null; return render(); }
  if (d.vp) { UI.viewport = d.vp; return render({ inspector: false }); }
  if (d.react) { UI.reactions = UI.reactions === d.react ? null : d.react; render({ inspector: false }); return toast(UI.mode === "edit" ? "Это предпросмотр: реакция не сохраняется" : "Реакция сохранена (в прототипе — локально)"); }
  if (d.drag) return;
  if (d.hide) { e.stopPropagation(); return toggleHidden(d.hide); }
  if (d.select) return select(d.select);
  if (d.move) return moveBlock(d.move, +d.dir);
  if (d.setsize) return commit(() => { S.page.blocks[UI.selected].size = d.setsize; });
  if (d.width) return commit(() => { S.page.blocks[UI.selected].width = d.width; });
  if (d.pagepreset) {
    const p = PAGE_PRESETS[d.pagepreset];
    commit(() => { S.page.preset = d.pagepreset; S.page.order = [...p.order]; S.page.blocks = structuredClone(p.blocks); });
    return toast(`Стиль «${p.name}» применён. Отменить — Ctrl+Z`);
  }
  if (d.cardpreset) { const p = CARD_PRESETS[d.cardpreset]; return setCard(() => { Object.assign(S.card, { preset: d.cardpreset, bg: p.bg, framed: p.framed }); }); }
  if (d.decor) return toggleDecor(d.decor);
  if (d.remove) { const x = DECOR[d.remove]; if (x.mod && UI.role !== "moderator") return toast("Этот стикер поставил модератор"); return toggleDecor(d.remove); }
  if (d.photo) { UI.photoSel = d.photo; return render(); }
  if (d.viewphoto) { UI.viewPhoto = d.viewphoto; return render({ inspector: false }); }
  if (d.phmove) {
    const a = S.place.photos, i = a.findIndex((p) => p.id === UI.photoSel), j = i + +d.phmove;
    return commit(() => { [a[i], a[j]] = [a[j], a[i]]; });
  }
  switch (d.act) {
    case "deselect": UI.selected = null; return render();
    case "sheet": UI.sheet = UI.sheet === "open" ? "closed" : "open"; return render();
    case "upload": return $("#file").click();
    case "setmain": commit(() => { S.place.mainId = UI.photoSel; }); return toast("Главное фото обновлено — карточка в ленте тоже");
    case "delphoto": {
      const wasMain = UI.photoSel === S.place.mainId;
      commit(() => {
        S.place.photos = S.place.photos.filter((p) => p.id !== UI.photoSel);
        if (wasMain) S.place.mainId = S.place.photos[0]?.id || null;
        UI.photoSel = S.place.mainId;
      });
      return toast(wasMain ? (S.place.mainId ? "Фото удалено. Главным стало следующее — проверьте карточку." : "Фото удалено. Карточка осталась без фото.") : "Фото удалено");
    }
    case "gotogallery": UI.tab = "page"; UI.mode = "edit"; return select("gallery");
    case "resetblock": { const p = PAGE_PRESETS[S.page.preset || "classic"]; return commit(() => { S.page.blocks[UI.selected] = structuredClone(p.blocks[UI.selected]); }); }
    case "reset": if (confirm("Вернуть демо-данные? Текущие правки пропадут (их можно вернуть через «Отменить»).")) { commit(() => { S = demo(); }); UI.selected = null; render(); } return;
    case "map": return toast("В прототипе карта не подключена");
    case "route": return toast("В прототипе маршрут не строится");
  }
});
document.addEventListener("pointerdown", (e) => { const h = e.target.closest("[data-drag]"); if (h && UI.mode === "edit") startDrag(e, h.dataset.drag); });
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !t.matches("input[type=text], textarea")) { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if (e.key === "Escape" && UI.selected) { const id = UI.selected; UI.selected = null; render(); return document.querySelector(`.blk[data-id="${id}"]`)?.focus(); }
  if (t.dataset?.drag && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault(); const id = t.dataset.drag; moveBlock(id, e.key === "ArrowUp" ? -1 : 1);
    document.querySelector(`[data-drag="${id}"]`)?.focus(); return;
  }
  if (t.classList?.contains("blk") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(t.dataset.id); return $("#panel .panel-head button, #panel input, #panel button")?.focus(); }
  if (t.dataset?.remove && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleDecor(t.dataset.remove); }
  if (t.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { UI.tab = UI.tab === "page" ? "card" : "page"; UI.selected = null; render(); $(`[data-tab="${UI.tab}"]`).focus(); }
});
/* Поля ввода: холст обновляется на каждый символ, история — одна запись на правку */
let pending = null;
document.addEventListener("focusin", (e) => { if (e.target.matches("[data-text], [data-alt]")) pending = snap(); });
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.text) {
    const k = t.dataset.text; S.place[k] = t.value;
    if (k === "name") {
      const words = t.value.trim().split(/\s+/).filter(Boolean);
      if (S.place.accent >= words.length) S.place.accent = words.length - 1;
      const sel = $("#f-accent");
      if (sel) sel.innerHTML = `<option value="-1">Без акцента</option>` + words.map((w, i) => `<option value="${i}" ${i === S.place.accent ? "selected" : ""}>${esc(w)}</option>`).join("");
    }
    const cnt = { name: "#c-name", description: "#c-desc", address: "#c-addr" }[k];
    if (cnt) $(cnt).textContent = `${t.value.length} / ${LIMITS[k]}`;
    UI.dirty = true; render({ inspector: false });
  }
  if (t.dataset.alt) { const p = S.place.photos.find((x) => x.id === t.dataset.alt); if (p) p.alt = t.value; UI.dirty = true; }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches("[data-text], [data-alt]")) {
    if (pending && pending !== snap()) { past.push(pending); future.length = 0; UI.reviewed = false; }
    pending = snap(); save(); return render({ inspector: false }); // панель не перерисовываем: фокус уже уходит к другому полю
  }
  if (t.id === "f-accent") return commit(() => { S.place.accent = +t.value; });
  if (t.name === "bg") return commit(() => { const c = S.page.blocks[UI.selected]; c.bg = t.value; if (c.text !== "auto" && ratio(TEXT.find((x) => x.id === c.text).hex, hex(t.value)) < 4.5) { c.text = "auto"; toast("Цвет текста переключён на «Авто»: прежний не читался бы на новом фоне"); } });
  if (t.name === "txt") return commit(() => { S.page.blocks[UI.selected].text = t.value; });
  if (t.name === "cardbg") return setCard(() => { S.card.bg = t.value; S.card.preset = Object.keys(CARD_PRESETS).find((k) => CARD_PRESETS[k].bg === t.value && CARD_PRESETS[k].framed === S.card.framed) || null; });
  if (t.dataset.visible) return toggleHidden(t.dataset.visible);
  if (t.id === "file") { addFiles(t.files); t.value = ""; }
  if (t.id === "role") {
    UI.role = t.value; UI.reviewed = false; UI.live = "";
    render(); toast(UI.role === "moderator" ? "Режим модератора: можно публиковать и ставить «Выбор редакции»" : "Режим владельца: изменения уходят на проверку");
  }
});
$("#undo").addEventListener("click", undo);
$("#redo").addEventListener("click", redo);
$("#publish").addEventListener("click", () => {
  const issues = [];
  if (!S.place.name.trim()) issues.push("название");
  if (!S.place.photos.length) issues.push("хотя бы одно фото");
  if (S.place.photos.some((p) => !p.alt.trim())) issues.push("описания у всех фото");
  if (issues.length) return toast("Перед отправкой заполните: " + issues.join(", "));
  if (UI.role === "moderator") { UI.dirty = false; render(); return toast("Опубликовано: изменения видны посетителям"); }
  UI.reviewed = true; UI.dirty = false; render(); toast("Отправлено модератору. Пока идёт проверка, посетители видят прежнюю версию.");
});
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--top-h", Math.ceil(e.target.getBoundingClientRect().height) + "px")).observe($(".topbar"));
render();
</script>
